name: Keystore Uret
on: workflow_dispatch
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          keytool -genkeypair -keystore release.keystore -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Ganyan Sosyal, O=Ganyan Sosyal, C=TR"
          echo '```' >> $GITHUB_STEP_SUMMARY
          base64 -w0 release.keystore >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
